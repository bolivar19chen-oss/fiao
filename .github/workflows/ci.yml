name: CI

on:
  push:
    branches: [main, fase-0-setup]
  pull_request:

# Cancela la corrida anterior de la misma rama: en una rama activa solo importa el ultimo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Valores de relleno, no secretos. El build necesita que las variables existan para
      # construir los clientes de Supabase; las paginas que consultan la base son dinamicas
      # y no se prerenderizan, asi que nunca se usan de verdad.
      # El dia que haga falta una base real en CI, van como secrets del repositorio.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el oraculo
        run: python -m pip install -e ".[dev]"
        working-directory: tools

      # Antes de las pruebas: el contraste diferencial de src/lib/credit/oracle.test.ts
      # lee py-results.json. Sin este paso, esa prueba se saltea.
      - name: Oraculo - generar resultados
        run: python -m oracle.emit
        working-directory: tools

      # Cada paso corre aunque el anterior falle: una corrida informa todos los problemas,
      # no solo el primero.
      - name: Formato
        if: always()
        run: pnpm format:check

      - name: Lint
        if: always()
        run: pnpm lint

      - name: Tipos
        if: always()
        run: pnpm typecheck

      - name: Pruebas
        if: always()
        run: pnpm test

      # No comparan una implementacion contra la otra, sino cada una contra reglas que
      # tienen que valer siempre. Un malentendido compartido del documento pasaria el
      # contraste; estas no.
      # El nucleo en C++ se compila aca; las propiedades de abajo lo comparan con Python.
      - name: Nucleo en C++ - compilar
        if: always()
        run: python -m native.build
        working-directory: tools

      - name: Oraculo - propiedades
        if: always()
        run: python -m pytest -q
        working-directory: tools

      # Va al final y es el que mas tarda, pero es el que atrapa lo que los otros no ven:
      # el build de produccion fallaba con lint, tipos y pruebas en verde.
      - name: Build
        if: always()
        run: pnpm build

      # Lee los manifiestos del build de arriba: protege el JS inicial de cada ruta.
      - name: Presupuesto de peso
        if: always()
        run: python -m perf.budget --dist ../.next
        working-directory: tools
